# Publishes to npm when a version tag is pushed.
#
# Authentication — pick one:
#
#   A. Trusted Publishing (recommended; no stored token)
#      npmjs.com → the package → Settings → Trusted Publisher → add this repo
#      (xmike04/canvas-student-mcp) and workflow file (release.yml). Then delete
#      the NPM_TOKEN repo secret. npm authenticates over short-lived OIDC
#      credentials instead, so there is no long-lived token to leak or rotate.
#
#   B. Automation token
#      npmjs.com → Access Tokens → Generate New Token → **Classic → Automation**.
#      The type matters: "Publish" tokens still require an interactive one-time
#      password and fail in CI with `npm error code EOTP`. Store it as the
#      NPM_TOKEN repo secret (Settings → Secrets and variables → Actions).
#
# Releasing:
#   npm version minor        # bumps package.json, commits, and creates the tag
#   git push --follow-tags   # pushing the tag is what triggers this workflow
#
# Running this workflow manually (Actions tab → Release → Run workflow) builds,
# tests, and inspects the package WITHOUT publishing — useful for a dry run.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong version
      # under the right name — catch it before anything is uploaded.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION, but package.json says $PKG_VERSION."
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag $GITHUB_REF_NAME."

      - run: npm run build

      - run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      # Trusted Publishing (OIDC) needs npm 11.5.1+; Node 20 ships npm 10.x.
      # Harmless when publishing with a token.
      - name: Use an npm that supports OIDC publishing
        if: startsWith(github.ref, 'refs/tags/')
        run: npm install -g npm@latest

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
        env:
          # Empty when no NPM_TOKEN secret exists, in which case npm falls back
          # to OIDC — so this line is safe to keep after moving to Trusted
          # Publishing, and safe to delete once you have.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
