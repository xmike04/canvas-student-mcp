# Publishes to npm when a version tag is pushed.
#
# Setup (one time):
#   1. Create an npm access token: npmjs.com → Access Tokens → Generate New Token
#      → "Automation" (bypasses 2FA in CI, which is what CI needs).
#   2. Add it to this repo: Settings → Secrets and variables → Actions →
#      New repository secret → name it NPM_TOKEN.
#
# Releasing:
#   npm version minor        # bumps package.json, commits, and creates the tag
#   git push --follow-tags   # pushing the tag is what triggers this workflow
#
# Running this workflow manually (Actions tab → Release → Run workflow) builds,
# tests, and inspects the package WITHOUT publishing — useful for a dry run.
#
# Optional hardening: once the package exists on npm, configure Trusted
# Publishing (npmjs.com → package → Settings → Trusted Publisher) to point at
# this repo and workflow. Then delete the NPM_TOKEN secret and the `env:` block
# on the publish step — npm authenticates over OIDC instead, with no long-lived
# token to leak, and provenance is generated automatically.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong version
      # under the right name — catch it before anything is uploaded.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION, but package.json says $PKG_VERSION."
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag $GITHUB_REF_NAME."

      - run: npm run build

      - run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
