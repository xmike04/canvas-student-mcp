# Publishes to npm when a version tag is pushed.
#
# Authentication: Trusted Publishing (OIDC). No npm token is stored anywhere.
# Configured on the package at npmjs.com → Settings → Trusted Publisher, pointing
# at this repo and this workflow file. npm exchanges the workflow's signed OIDC
# identity for short-lived credentials at publish time.
#
# If you ever revert to a token, note that only **Classic → Automation** tokens
# work in CI — "Publish" tokens require an interactive one-time password and
# fail with `npm error code EOTP`.
#
# IMPORTANT: a tag push runs the workflow file **as it exists at that tag**, so
# always tag a commit that contains the workflow you intend to run.
#
# Releasing:
#   npm version minor        # bumps package.json, commits, and creates the tag
#   git push --follow-tags   # pushing the tag is what triggers this workflow
#
# Running this workflow manually (Actions tab → Release → Run workflow) builds,
# tests, and inspects the package WITHOUT publishing — useful for a dry run.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong version
      # under the right name — catch it before anything is uploaded.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION, but package.json says $PKG_VERSION."
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag $GITHUB_REF_NAME."

      - run: npm run build

      - run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      # Trusted Publishing (OIDC) needs npm 11.5.1+; Node 20 ships npm 10.x.
      # Harmless when publishing with a token.
      - name: Use an npm that supports OIDC publishing
        if: startsWith(github.ref, 'refs/tags/')
        run: npm install -g npm@latest

      # No token: npm exchanges the workflow's OIDC identity for short-lived
      # credentials via Trusted Publishing, configured on the package at npmjs.com.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
